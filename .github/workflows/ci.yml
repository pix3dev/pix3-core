name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      # `npm pack` of all five packages: each `prepack` builds what it ships (the CLI bundle, runtime
      # types and agent kit from this checkout's sources; the prebuilt editor and its contract-B gate,
      # no /@vite/client trigger in dist/; the plugin's dist/), then the tarballs are scanned for
      # specs, fixtures, plans, the Spine runtime, secrets and local paths, and their manifests for
      # the lockstep pins (README → "Releasing"). The scratch-project install runs locally only.
      - name: Pack and scan the tarballs
        run: npm run release:check -- --pack-only
