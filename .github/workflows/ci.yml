name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      # The CLI bundle, runtime types and agent kit are built from this checkout's sources; a broken
      # path between packages shows up here before it reaches a tarball.
      - name: Build @pix3/cli
        working-directory: packages/cli
        run: npm run copy-templates && npm run build && npm run build-runtime-types && npm run build-kit
